            {id:14,level:"中上签",type:"稳中求进",poem:"步步为营稳当行，谨慎前进无大惊。\n小成可期大器晚，厚积薄发终成功。",explanation:"运势稳健，虽无大喜但持续向好。适合稳扎稳打，不宜冒险激进。耐心等待机会。",career:"工作稳定，小有进步，需要持续努力。",wealth:"收入稳定增长，适合储蓄而非投机。",love:"感情平稳发展，细水长流，需要经营。",health:"健康平稳，坚持养生效果好。",advice:"保持现状，稳步推进计划。积累经验和资源，等待更好时机。",probability:10},
            {id:15,level:"中上签",type:"渐入佳境",poem:"开始虽难莫灰心，坚持努力见光明。\n困境过后见彩虹，渐入佳境福自来。",explanation:"运势呈上升趋势，开始可能困难，但坚持下去会越来越好。前景光明。",career:"新工作或项目初期有挑战，熟悉后会顺利。",wealth:"财运渐好，投资需要时间见效。",love:"感情需要磨合，度过磨合期会很甜蜜。",health:"身体恢复中，养生见效，越来越好。",advice:"不要轻易放弃，坚持就是胜利。给自己和别人时间适应。",probability:10},
            {id:16,level:"中上签",type:"贵人指路",poem:"迷途之时有人指，拨云见日豁然开。\n听取良言莫固执，顺势而为成大事。",explanation:"遇到困惑时会有高人指点。重要的是虚心听取建议，不要一意孤行。",career:"前辈或导师的建议很重要，虚心学习。",wealth:"投资理财可咨询专业人士，避免盲目。",love:"长辈或朋友的意见值得参考，不要冲动。",health:"身体不适应及时就医，听从医嘱。",advice:"遇事多请教有经验的人。保持开放心态接受建议。三思而后行。",probability:10},
            {id:17,level:"中上签",type:"柳暗花明",poem:"山重水复疑无路，柳暗花明又一村。\n莫被眼前困难挡，转角即是新天地。",explanation:"看似困难重重，实则转机就在眼前。换个角度思考，问题会迎刃而解。",career:"工作遇瓶颈，尝试新方法会有突破。",wealth:"财路暂时不明朗，寻找新渠道会有收获。",love:"感情遇冷淡期，创造新鲜感能重燃激情。",health:"换个治疗方式或生活习惯，健康会改善。",advice:"不要钻牛角尖，多角度看问题。尝试新方法，改变思维模式。",probability:10},
            {id:18,level:"中上签",type:"小有所获",poem:"勤劳耕耘有收成，虽非大丰亦可喜。\n点滴积累成江河，知足常乐心欢喜。",explanation:"付出有回报，虽不是大富大贵，但稳定收获也值得欣慰。积少成多，知足常乐。",career:"工作成果得到认可，小有奖励。",wealth:"收入有增长，虽不多但很稳定。",love:"感情有小进展，小惊喜不断。",health:"身体状态好转，小病痊愈。",advice:"珍惜每一份收获，不要好高骛远。持续努力，量变引起质变。",probability:10},
            {id:19,level:"中上签",type:"厚积薄发",poem:"默默耕耘莫浮躁，积累实力待时机。\n韬光养晦非无能，时机一到展才华。",explanation:"现在是积累期而非爆发期。沉下心来提升自己，时机成熟自然成功。",career:"学习充电阶段，暂时低调，未来可期。",wealth:"财富积累阶段，投资长期项目为佳。",love:"感情需要时间培养，不急于一时。",health:"调养身体，打好基础，预防疾病。",advice:"投资自己，学习新技能。制定长期计划，不急功近利。修炼内功。",probability:10},
            {id:20,level:"中上签",type:"否极泰来",poem:"苦尽甘来福运转，否极泰来好运连。\n经历风雨见彩虹，困境已过迎光明。",explanation:"过去的困难即将过去，新的好运正在到来。坚持就是胜利，曙光就在前方。",career:"困难时期已过，工作将顺利起来。",wealth:"财务压力减轻，经济状况好转。",love:"感情危机化解，关系重归于好。",health:"病痛减轻或痊愈，身体恢复健康。",advice:"保持信心，坚持到底。总结经验教训，避免重蹈覆辙。",probability:10},
            {id:21,level:"中上签",type:"和气生财",poem:"待人和善福气来，宽容大度化干戈。\n与人为善天地宽，和气生财万事兴。",explanation:"人际和谐是成功的关键。以和为贵，宽容待人，会带来意想不到的好运。",career:"团队合作顺利，人际关系和谐。",wealth:"合作生意兴隆，人脉带来财运。",love:"感情和睦，家庭幸福，减少争吵。",health:"心平气和有益健康，情绪稳定。",advice:"化解矛盾，以和为贵。真诚待人，建立良好人际关系。",probability:10},
            {id:22,level:"中上签",type:"智慧指引",poem:"遇事多思三分利，谋定后动成功高。\n智慧人生少弯路，深思熟虑乃上策。",explanation:"需要运用智慧和策略。深思熟虑后再行动，不要冲动，成功率会更高。",career:"复杂问题需要巧妙解决，多思考。",wealth:"理财投资需要分析研究，理性决策。",love:"感情问题需要智慧处理，沟通技巧重要。",health:"了解养生知识，科学保健。",advice:"多读书思考，提升智慧。遇事冷静分析，不冲动。向聪明人学习。",probability:10},
            {id:23,level:"中上签",type:"修身养性",poem:"静心修行养身心，内外兼修德才全。\n品格高尚福自来，修养提升运势好。",explanation:"注重内在修养和品德提升。外在的成功需要内在的充实，修身养性会带来好运。",career:"提升职业素养，注重职业道德。",wealth:"君子爱财取之有道，正道赚钱。",love:"内在美更吸引人，修养提升魅力。",health:"心性平和有益健康，修身养性延年益寿。",advice:"培养良好品格，提升个人修养。多读书反思，追求内在成长。",probability:10},
            {id:24,level:"中吉签",type:"平稳向前",poem:"平平淡淡是真情，不急不缓稳当行。\n生活虽无大波澜，踏实前进终有成。",explanation:"运势平稳，生活波澜不惊。虽无大喜大悲，但稳定也是一种幸福。踏实生活。",career:"工作平稳，按部就班，不会有大变动。",wealth:"收入稳定，开支正常，财务平衡。",love:"感情平淡，日常相处，需要创造新鲜感。",health:"健康平稳，注意日常保养。",advice:"珍惜平淡生活，稳定也是福气。偶尔制造小惊喜增添生活乐趣。",probability:10},
            {id:25,level:"中吉签",type:"耐心等待",poem:"时机未到莫着急，耐心等待终有时。\n守得云开见月明，静待花开结果时。",explanation:"目前不是行动的最佳时机，需要耐心等待。时机成熟时自然水到渠成。",career:"暂不宜跳槽或大改变，等待更好机会。",wealth:"投资需等待时机，不要急于求成。",love:"缘分未到，耐心等待合适的人。",health:"慢性病需要时间调理，不要心急。",advice:"培养耐心，学会等待。利用这段时间提升自己。观察时机，不盲目行动。",probability:10},
            {id:26,level:"中吉签",type:"细水长流",poem:"感情深厚细水流，日久天长情意稠。\n平凡生活见真情，细心经营感情牢。",explanation:"强调长久和稳定。无论事业感情，都需要细心经营和长期投入，急不得。",career:"职业发展需要长期规划，一步步来。",wealth:"理财讲究长期投资，不要想着一夜暴富。",love:"感情需要用心维护，日常陪伴很重要。",health:"健康管理是长期工程，坚持养生。",advice:"凡事看长远，不要只看眼前。感情事业都需要持续投入。细心经营生活。",probability:10},
            {id:27,level:"中吉签",type:"小心谨慎",poem:"行事需要多留心，谨言慎行避风险。\n小心驶得万年船，步步为营保平安。",explanation:"需要谨慎小心，避免大意失荆州。细节决定成败，多注意细节问题。",career:"工作中注意细节，避免粗心犯错。",wealth:"理财投资要谨慎，不要冒险。",love:"感情中注意言行，避免误会。",health:"注意安全，预防事故和疾病。",advice:"做事仔细认真，检查再三。大事小事都不可大意。安全第一。",probability:10},
            {id:28,level:"中吉签",type:"知足常乐",poem:"知足之人常快乐，比上不足比下余。\n感恩拥有惜当下，平凡幸福最可贵。",explanation:"提醒要知足感恩。不要过度攀比，珍惜现在拥有的，平凡生活也是幸福。",career:"工作虽普通但稳定，知足为佳。",wealth:"收入够用即可，不要贪心。",love:"伴侣虽平凡但真心，珍惜眼前人。",health:"身体健康就是福，不要过度劳累。",advice:"学会感恩，珍惜拥有。降低欲望，减少焦虑。平凡生活也要用心过。",probability:10},
            {id:29,level:"中吉签",type:"循序渐进",poem:"万事莫要求速成，一步一个脚印行。\n欲速则不达道理，循序渐进终成功。",explanation:"不要急于求成，成功需要过程。脚踏实地，一步一个脚印，才能走得稳。",career:"职业发展不能跳级，需要逐步晋升。",wealth:"财富积累需要时间，不要想一夜暴富。",love:"感情发展需要过程，不能操之过急。",health:"身体调理需要时间，不能速效。",advice:"制定合理计划，分步实施。不要急功近利，质量比速度重要。",probability:10},
            {id:30,level:"中吉签",type:"把握当下",poem:"光阴似箭不复返，珍惜当下好时光。\n莫让岁月空流逝，把握今天创辉煌。",explanation:"提醒珍惜时间，把握现在。不要总想着过去或未来，活在当下最重要。",career:"把握当前工作机会，认真对待。",wealth:"理性消费，享受生活，平衡储蓄。",love:"珍惜陪伴时光，用心经营关系。",health:"及时养生保健,不要等老了才后悔。",advice:"活在当下，享受生活。不要拖延，现在就行动。时间最宝贵。",probability:10},
            {id:31,level:"中吉签",type:"真诚待人",poem:"真心实意交朋友，诚信为本立人生。\n以诚待人人敬重，真诚换来真友情。",explanation:"强调真诚和诚信的重要性。真心对待他人，会收获真心朋友和好运。",career:"诚信经营，真诚待客，生意长久。",wealth:"诚实赚钱，心安理得，福报自来。",love:"真心相待，坦诚沟通，感情稳固。",health:"心地坦荡，身心健康。",advice:"真诚待人，不要虚伪。诚信做事，建立良好口碑。坦率沟通。",probability:10},
            {id:32,level:"中吉签",type:"自我提升",poem:"投资自己最划算，学习成长不停歇。\n技能提升价值高，能力增强前景好。",explanation:"投资自己是最好的投资。不断学习和成长，提升能力，未来会更好。",career:"学习新技能，提升竞争力。",wealth:"能力提升带来收入增长。",love:"自我成长让你更有魅力。",health:"学习健康知识，科学养生。",advice:"报培训班，读书学习。不断充实自己。终身学习，持续成长。",probability:10},
            {id:33,level:"中吉签",type:"适度休息",poem:"张弛有度身心健，劳逸结合效率高。\n休息不是浪费时，充电之后再出发。",explanation:"提醒要注意休息，不要过度劳累。适当休息是为了更好地前进。",career:"工作重要，休息也重要，避免过劳。",wealth:"赚钱重要，健康更重要，量力而行。",love:"给彼此空间，不要太粘人。",health:"保证睡眠，定期休假，养精蓄锐。",advice:"劳逸结合，不要透支身体。定期休假放松。给自己充电时间。",probability:10},
            {id:34,level:"中平签",type:"平淡是真",poem:"平平淡淡过一生，无风无浪亦安心。\n简单生活少烦恼，朴素真实见本心。",explanation:"生活平淡无奇，但也平平安安。没有大起大落，保持平常心，简单生活也是福。",career:"工作平稳，无升无降，维持现状。",wealth:"收支平衡，没有大笔进账也没有破财。",love:"感情平淡如水，细水长流。",health:"健康平稳，无病无痛。",advice:"保持平常心，不要强求。珍惜平凡生活，避免折腾。",probability:7},
            {id:35,level:"中平签",type:"静观其变",poem:"暂且观望不宜动，静待时机再出手。\n动静之间有玄机，时机不对莫强求。",explanation:"现在不是行动的时候，需要静观其变。观察局势，等待更明朗再做决定。",career:"工作上不宜大动作，维持现状观察。",wealth:"投资暂缓，观望市场形势。",love:"感情暂时不要有大决定，再观察。",health:"身体无大碍，保持现有养生方式。",advice:"不要冲动行事，多观察少行动。等待更好时机。保持警惕。",probability:7},
            {id:36,level:"中平签",type:"修养生息",poem:"春去秋来皆有时，种子休眠待春来。\n修养生息蓄能量,厚积薄发未来期。",explanation:"这是休养生息的时期，不是大展拳脚的时候。养精蓄锐，为未来做准备。",career:"职业低谷期，利用这段时间充电学习。",wealth:"财运平平，控制支出，储备资金。",love:"感情平淡期，各自提升自己。",health:"身体恢复期，注意调理养生。",advice:"不要强求发展，好好休息。利用闲暇时间学习。积蓄力量。",probability:7},
            {id:37,level:"中平签",type:"量力而行",poem:"力所能及方能成，超出能力必受伤。\n认清自己量力行，稳扎稳打步步升。",explanation:"做事要量力而行,不要超出自己能力范围。认清现实，脚踏实地才是正道。",career:"不要接受超出能力的任务，量力而为。",wealth:"不要投资超过承受能力的项目。",love:"不要勉强感情，不合适就不要强求。",health:"运动要适量，不要过度。",advice:"认清自己的能力边界。不要好高骛远。稳健发展最重要。",probability:7},
            {id:38,level:"中平签",type:"保持本分",poem:"守住本分不越界，安分守己少是非。\n不贪非分之财物，平安度日福自来。",explanation:"提醒守规矩，不要越界。安分守己，不贪心，才能平安顺遂。",career:"做好本职工作，不要越权或偷懒。",wealth:"合法赚钱，不要贪图非分之财。",love:"忠于伴侣，不要有非分之想。",health:"遵守医嘱，按时作息。",advice:"遵守规则，不要投机取巧。本分做人，踏实做事。知足常乐。",probability:7},
            {id:39,level:"中平签",type:"顺其自然",poem:"强求不如顺自然，水到渠成莫心焦。\n随缘而行心自在，放下执念得安宁。",explanation:"不要强求，顺其自然最好。有些事强求不来，放松心态，顺势而为。",career:"职业发展顺其自然，不要过度焦虑。",wealth:"财运平平，顺其自然，不强求。",love:"感情随缘，不要执着，缘分到了自然来。",health:"身心放松，自然健康。",advice:"放下执念，随遇而安。不要控制欲太强。学会接受现实。",probability:7},
            {id:40,level:"中平签",type:"沉淀积累",poem:"沉淀自己厚积累，量变质变需时日。\n埋头苦干莫浮躁，功到自然成大器。",explanation:"需要时间沉淀和积累，不要浮躁。默默努力，量变到质变需要过程。",career:"继续积累经验，暂时不会有大突破。",wealth:"财富慢慢积累，不要急于求成。",love:"感情需要时间培养，慢慢深入。",health:"身体调理需要时间，坚持养生。",advice:"戒骄戒躁，埋头苦干。相信积累的力量。给自己时间成长。",probability:7},
            {id:41,level:"中签",type:"平常心态",poem:"不以物喜不悲己，平常心看世间事。\n得之我幸失我命，淡然处之心自宁。",explanation:"保持平常心最重要。不要因得失而大喜大悲，淡然面对生活起伏。",career:"工作有平有淡，以平常心对待。",wealth:"财来财去很正常，平常心看待。",love:"感情有起有伏，平常心经营。",health:"身体偶有小恙，平常心对待。",advice:"修炼平常心，不要情绪化。得失随缘，保持内心平静。",probability:5},
            {id:42,level:"中签",type:"中庸之道",poem:"不偏不倚走中道，过犹不及需谨记。\n凡事适度为最佳，中庸之道是真谛。",explanation:"凡事讲究适度,不要走极端。中庸之道才是长久之计。",career:"工作不要太拼命也不要太懈怠。",wealth:"既不要守财奴也不要乱花钱。",love:"既不要太冷淡也不要太粘人。",health:"饮食运动都要适度，不要极端。",advice:"掌握分寸，凡事适度。避免极端思维和行为。平衡最重要。",probability:5},
            {id:43,level:"中签",type:"默默耕耘",poem:"莫问收获且耕耘，付出自有回报时。\n埋头苦干不声张，低调做事高调心。",explanation:"默默努力，不要总想着回报。踏实做事，结果会自然呈现。",career:"认真工作，不要太计较得失。",wealth:"努力赚钱，不要总想着暴富。",love:"真心付出，不要总要求回报。",health:"坚持养生，不要急于见效。",advice:"少说多做，默默努力。不要太在意别人眼光。脚踏实地。",probability:5},
            {id:44,level:"中签",type:"自我反省",poem:"吾日三省吾身心，错误及时需改正。\n反省自己找不足，改进提升路更宽。",explanation:"需要自我反省和改进。发现问题及时改正，才能不断进步。",career:"工作中找找自己的不足,改进提升。",wealth:"反思理财方式，调整策略。",love:"感情出问题先反省自己。",health:"检查生活习惯，改掉坏毛病。",advice:"经常自我反省，勇于改正错误。听取批评意见。持续改进。",probability:5},

        ];

        // ====== 全局变量 ======
        let currentFortune = null;
        let currentUserName = '';
        let isAnonymous = false;

        // ====== 烟花动画 ======
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        function createFirework() {
            if (Math.random() < 0.03) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height / 2;
                const color = ['#FFD700', '#FF6347', '#FF69B4', '#FFA500'][Math.floor(Math.random() * 4)];
                for (let i = 0; i < 30; i++) {
                    particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        life: 100,
                        color: color
                    });
                }
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= 2;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 100;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function animate() {
            createFirework();
            updateParticles();
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ====== 工具函数 ======
        function getWeightedFortune() {
            const pool = [];
            fortunes.forEach(f => {
                for (let i = 0; i < f.probability; i++) {
                    pool.push(f);
                }
            });
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function maskName(name) {
            if (name.length <= 1) return name;
            return name[0] + '*'.repeat(name.length - 1);
        }

        function formatTime(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}`;
        }

        // ====== 抽签逻辑 ======
        function startDraw() {
            const userName = document.getElementById('userName').value.trim();
            if (!userName) {
                alert('请先输入您的姓名哦！🎋');
                return;
            }
            isAnonymous = document.getElementById('anonymous').checked;
            currentUserName = userName;
            
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('drawingAnimation').style.display = 'block';
            
            setTimeout(() => showResult(), 2000);
        }

        function showResult() {
            currentFortune = getWeightedFortune();
            const displayName = isAnonymous ? '匿名善信' : currentUserName;
            
            document.getElementById('fortuneTitle').textContent = `${displayName} 抽得：${currentFortune.level}`;
            document.getElementById('fortuneType').textContent = `【 ${currentFortune.type} 】`;
            document.getElementById('fortunePoem').textContent = currentFortune.poem;
            document.getElementById('fortuneExplanation').textContent = currentFortune.explanation;
            document.getElementById('fortuneAdvice').textContent = currentFortune.advice;
            
            const aspectsHTML = `
                <div class="aspect-card"><h4>💼 事业运</h4><p>${currentFortune.career}</p></div>
                <div class="aspect-card"><h4>💰 财运</h4><p>${currentFortune.wealth}</p></div>
                <div class="aspect-card"><h4>💕 感情运</h4><p>${currentFortune.love}</p></div>
                <div class="aspect-card"><h4>🏥 健康运</h4><p>${currentFortune.health}</p></div>
            `;
            document.getElementById('fortuneAspects').innerHTML = aspectsHTML;
            
            document.getElementById('drawingAnimation').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            
            saveToGitHub();
        }

        function resetDraw() {
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('userName').value = '';
            document.getElementById('blessing').value = '';
            document.getElementById('anonymous').checked = false;
            document.getElementById('userName').focus();
        }

        // ====== GitHub Issues 数据持久化 ======
        async function saveToGitHub() {
            if (!CONFIG.token) {
                console.log('未配置GitHub Token，跳过保存');
                return;
            }

            const blessing = document.getElementById('blessing').value.trim();
            const displayName = isAnonymous ? '匿名善信' : maskName(currentUserName);
            const title = `${displayName} - ${currentFortune.level} - ${formatTime(new Date())}`;
            const body = `**姓名**: ${displayName}
**签文**: ${currentFortune.level} - ${currentFortune.type}
**时间**: ${formatTime(new Date())}

**签诗**:
${currentFortune.poem}

**解析**: ${currentFortune.explanation}

${blessing ? `**祝福**: ${blessing}
` : ''}---
🏮 新春祈福抽签 🏮`;

            try {
                await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/issues`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        body: body,
                        labels: ['新春抽签', '龙年祈福']
                    })
                });
                loadVisitors();
            } catch (e) {
                console.error('保存失败:', e);
            }
        }

        async function loadVisitors() {
            const loading = document.getElementById('wallLoading');
            const list = document.getElementById('visitorList');
            
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/issues?labels=新春抽签&state=all&per_page=20&sort=created&direction=desc`);
                const issues = await res.json();
                
                loading.style.display = 'none';
                
                if (issues.length === 0) {
                    list.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">暂无访客记录</p>';
                    return;
                }
                
                let stats = { total: issues.length, lucky: 0 };
                
                list.innerHTML = issues.map(issue => {
                    const match = issue.title.match(/(.*?)\s-\s(.*?)\s-\s(.*)/);
                    if (!match) return '';
                    
                    const name = match[1];
                    const fortune = match[2];
                    const time = match[3];
                    
                    if (fortune.includes('上吉签') || fortune.includes('上上签')) {
                        stats.lucky++;
                    }
                    
                    const blessingMatch = issue.body.match(/\*\*祝福\*\*:\s*(.+)/);
                    const blessing = blessingMatch ? blessingMatch[1] : '';
                    
                    return `
                        <div class="visitor-item">
                            <div class="visitor-name">${name}</div>
                            <div class="visitor-fortune">${fortune}</div>
                            <div class="visitor-time">🕐 ${time}</div>
                            ${blessing ? `<div class="visitor-blessing">💬 ${blessing}</div>` : ''}
                        </div>
                    `;
                }).join('');
                
                document.getElementById('totalCount').textContent = stats.total;
                document.getElementById('luckyCount').textContent = stats.lucky;
                document.getElementById('visitorCount').textContent = stats.total;
                
            } catch (e) {
                loading.style.display = 'none';
                list.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">加载失败，请稍后再试</p>';
                console.error('加载失败:', e);
            }
        }

        // ====== 页面加载时初始化 ======
        window.addEventListener('DOMContentLoaded', () => {
            loadVisitors();
        });
    </script>
